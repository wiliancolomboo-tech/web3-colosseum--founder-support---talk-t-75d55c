[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.18"

[features]
seeds = true
skip-lint = false

[programs.localnet]
colosseum_founder_loop = "ColoLoop1111111111111111111111111111111111111"

[programs.devnet]
colosseum_founder_loop = "ColoLoop1111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-node --project tsconfig.json -r tsconfig-paths/register ./node_modules/.bin/_mocha -r ts-node/register --timeout 60000 tests/**/*.ts"