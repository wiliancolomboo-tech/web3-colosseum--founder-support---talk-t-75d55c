version: '3.8'

services:
  founder-pulse-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: founder-pulse-agent
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=FndrSupp11111111111111111111111111111111111
      - FOUNDER_KEYPAIR=[1,2,3...REDACTED_KEYPAIR_BYTES]
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_123456789
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/healthz', (res) => { if (res.statusCode !== 200) process.exit(1); })"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s