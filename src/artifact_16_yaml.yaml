version: '3.8'

services:
  poi-oracle-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colosseum_poi_agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=ColoTalk5Users11111111111111111111111111111
      - ORACLE_PRIVATE_KEY=[1,2,3...255] # 64-byte JSON keypair array
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_123456789
      - NOTIFICATION_EMAIL=accelerator@colosseum.org
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s