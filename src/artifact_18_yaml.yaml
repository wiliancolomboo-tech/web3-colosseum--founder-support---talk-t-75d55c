version: "3.8"

services:
  userpulse-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colosseum-userpulse-engine
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=CPuLse1111111111111111111111111111111111111
      - FOUNDER_SECRET_KEY=[1,2,3...REDACTED]
      - RESEND_API_KEY=re_test_000000000000000000000000
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"