version: "3.8"

services:
  userloop-worker:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=UsrLoop5555555555555555555555555555555555555
      - FOUNDER_KEYPAIR_PATH=/secrets/founder-keypair.json
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - ./founder-keypair.json:/secrets/founder-keypair.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s