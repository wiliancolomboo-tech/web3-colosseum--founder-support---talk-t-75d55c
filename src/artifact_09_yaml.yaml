version: "3.8"
services:
  founderproof-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: colosseum/founderproof-engine:latest
    container_name: founderproof-service
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=${PROGRAM_ID}
      - FOUNDER_SECRET_KEY=${FOUNDER_SECRET_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"